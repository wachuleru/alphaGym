<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1124" />
  <title>GymTrack — Gestión integral del gimnasio</title>
  <meta name="description" content="GymTrack: plataforma administrativa para gimnasios. Asistencia, rutinas, progreso físico, pagos, informes y respaldos. Almacenamiento local seguro." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />

  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/views.css" />
  <link rel="stylesheet" href="./assets/css/print.css" media="print" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <!-- SheetJS (Excel import/export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js" defer></script>
</head>

<body class="app-shell" data-theme="dark">
  <!-- Skip link for accessibility -->
  <a class="skip-link" href="#main">Saltar al contenido principal</a>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <header class="sidebar__head">
      <a href="#/dashboard" class="brand" aria-label="GymTrack inicio">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 16h20" />
            <path d="M9 10v12" />
            <path d="M23 10v12" />
            <path d="M2 12v8" />
            <path d="M30 12v8" />
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">GymTrack</span>
          <span class="brand__sub">Gestión integral</span>
        </span>
      </a>
      <button class="sidebar__close" id="sidebarClose" aria-label="Cerrar menú" type="button">
        <i data-lucide="x"></i>
      </button>
    </header>

    <nav class="sidebar__nav" aria-label="Secciones">
      <ul class="nav-list" id="navList">
        <li><a href="#/dashboard" data-route="dashboard" class="nav-link"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></li>
        <li><a href="#/students" data-route="students" class="nav-link"><i data-lucide="users"></i><span>Alumnos</span></a></li>
        <li><a href="#/attendance" data-route="attendance" class="nav-link"><i data-lucide="calendar-check-2"></i><span>Asistencia</span></a></li>
        <li><a href="#/workouts" data-route="workouts" class="nav-link"><i data-lucide="dumbbell"></i><span>Entrenamientos</span></a></li>
        <li><a href="#/progress" data-route="progress" class="nav-link"><i data-lucide="trending-up"></i><span>Progreso físico</span></a></li>
        <li><a href="#/payments" data-route="payments" class="nav-link"><i data-lucide="credit-card"></i><span>Pagos</span></a></li>
        <li><a href="#/reports" data-route="reports" class="nav-link"><i data-lucide="file-text"></i><span>Informes</span></a></li>
        <li><a href="#/settings" data-route="settings" class="nav-link"><i data-lucide="settings"></i><span>Datos y configuración</span></a></li>
      </ul>
    </nav>

    <footer class="sidebar__foot">
      <div class="save-indicator" id="saveIndicator" role="status" aria-live="polite">
        <span class="save-indicator__dot" aria-hidden="true"></span>
        <span class="save-indicator__label">Datos guardados localmente</span>
      </div>
      <div class="sidebar__hint">v1 · datos en este navegador</div>
    </footer>
  </aside>

  <!-- Mobile header -->
  <header class="topbar" id="topbar">
    <button class="topbar__menu" id="sidebarToggle" type="button" aria-label="Abrir menú">
      <i data-lucide="menu"></i>
    </button>
    <a class="topbar__brand" href="#/dashboard">GymTrack</a>
    <div class="topbar__actions">
      <button class="icon-btn" id="quickSearchBtn" type="button" aria-label="Buscar">
        <i data-lucide="search"></i>
      </button>
    </div>
  </header>

  <!-- Sidebar backdrop for mobile -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- Main content -->
  <main id="main" class="main" tabindex="-1"></main>

  <!-- Toast container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- Modal container -->
  <div id="modalContainer" class="modal-container" aria-hidden="true"></div>

  <!-- Entry point (must be type=module and at end so storage/router etc are available before views render) -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
